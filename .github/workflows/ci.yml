# 푸시·PR 마다 설정 확인과 테스트 (템플릿 문법, 필터). api 없이 돈다
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 설정 확인
        run: python manage.py check
      - name: 테스트
        run: python manage.py test
